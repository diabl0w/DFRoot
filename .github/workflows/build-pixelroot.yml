name: Build PixelRoot APK

on:
  push:
    branches: [ master, main, 'port/*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Build LKM Kernel Objects
        run: |
          set -e
          mkdir -p app/src/main/jni/ko
          for kmi in android12-5.10 android13-5.10 android13-5.15 android14-5.15 android14-6.1 android15-6.6 android16-6.12 android17-6.18; do
            echo "=== Building dfroot-$kmi.ko ==="
            docker run --rm --pid=host --network=none \
              -v "$PWD:/proj" \
              -e KMI="$kmi" \
              "ghcr.io/ylarod/ddk-min:${kmi}-20260828" \
              bash -c 'set -e; cd /proj/lkm; make -j$(nproc); cp dfroot.ko /proj/app/src/main/jni/ko/dfroot-$KMI.ko; make clean'
          done
          sudo chmod -R a+rwX app/src/main/jni/ko/
          ls -lh app/src/main/jni/ko/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          SDKMGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build PixelRoot Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload PixelRoot APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelRoot-1.0.0-APK
          path: app/build/outputs/apk/debug/*.apk
